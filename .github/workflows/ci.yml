# CI pipeline using ci-framework reusable workflow
name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@0483e3dcb80aa9b0a7e06f9df8f8128fc73c0746  # v2.9.9
    with:
      pixi-environment: "ci"
      python-versions: '["3.11", "3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-postgres: true
      editable-install: false
    secrets: inherit

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.ci.result }}" == "success" ]]; then
            echo "CI passed"
          else
            echo "CI failed with result: ${{ needs.ci.result }}"
            exit 1
          fi
