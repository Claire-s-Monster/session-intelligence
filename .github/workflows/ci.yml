---
# DIAGNOSTIC: Call our stripped-down copy of reusable-ci.yml locally
# Removed: security job, performance job, self-heal job
# Removed: emoji from job names
# If this works, add back sections one at a time
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/test-reusable.yml
    with:
      pixi-environment: "ci"
      python-versions: '["3.11", "3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-release: false
    secrets: inherit
