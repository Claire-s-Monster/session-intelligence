---
# DIAGNOSTIC: Test a DIFFERENT reusable workflow from ci-framework
# If cleanup-dev-files works but reusable-ci doesn't,
# the issue is in reusable-ci.yml content specifically.
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Test: call cleanup-dev-files.yml (a different reusable workflow)
  test-cleanup:
    uses: Claire-s-Monster/ci-framework/.github/workflows/cleanup-dev-files.yml@main
    with:
      cleanup_patterns: '["*.tmp"]'
      target_branches: '["development"]'
      workflow_name: 'Test'
    secrets: inherit
