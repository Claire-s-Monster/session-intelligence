---
# Stripped-down copy of ci-framework's reusable-ci.yml for binary search debugging
# Start with MINIMAL version, add sections back to find the breaking element
name: Test Reusable CI

on:
  workflow_call:
    inputs:
      pixi-environment:
        description: "The PIXI environment to use"
        required: false
        type: string
        default: 'ci'
      package-path:
        description: "Relative path to the package directory"
        required: false
        type: string
        default: '.'
      enable-hygiene-check:
        description: "Enable repository hygiene checks"
        required: false
        type: boolean
        default: true
      enable-performance:
        description: "Enable performance benchmarks"
        required: false
        type: boolean
        default: true
      enable-release:
        description: "Enable automated releases"
        required: false
        type: boolean
        default: true
      python-versions:
        description: "JSON array of Python versions"
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'
      os-matrix:
        description: "JSON array of OS"
        required: false
        type: string
        default: '["ubuntu-latest"]'
      editable-install:
        description: "Install in editable mode"
        required: false
        type: boolean
        default: true
      allowed-licenses:
        description: "Comma-separated allowed licenses"
        required: false
        type: string
        default: 'MIT, Apache-2.0, BSD-3-Clause'
    secrets:
      CODECOV_TOKEN:
        required: false
      PYPI_API_TOKEN:
        required: false
      GH_PAT:
        required: false
      SOURCERY_TOKEN:
        required: false

jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      tests: ${{ steps.changes.outputs.tests }}
      security: ${{ steps.changes.outputs.security }}
      performance: ${{ steps.changes.outputs.performance }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - '${{ inputs.package-path }}/src/**'
              - '${{ inputs.package-path }}/pyproject.toml'
            tests:
              - '${{ inputs.package-path }}/tests/**'
            security:
              - '${{ inputs.package-path }}/pyproject.toml'
            performance:
              - '${{ inputs.package-path }}/tests/performance/**'

  hygiene:
    name: "Repository Hygiene"
    runs-on: ubuntu-latest
    if: inputs.enable-hygiene-check
    steps:
      - uses: actions/checkout@v6
      - name: "Check for pixi project"
        working-directory: ${{ inputs.package-path }}
        run: |
          if [ ! -f pixi.toml ] && [ ! -f pixi.lock ]; then
            echo "::error::No pixi.toml or pixi.lock found"
            exit 1
          fi
          echo "Pixi project detected"

  quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.13
        with:
          pixi-version: v0.49.0
          cache: false
      - name: "Install and Lint"
        working-directory: ${{ inputs.package-path }}
        run: |
          pixi install -e ${{ inputs.pixi-environment }}
          pixi run -e ${{ inputs.pixi-environment }} quality

  test:
    name: "Test Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.src == 'true' ||
      needs.detect-changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: prefix-dev/setup-pixi@v0.8.13
        with:
          pixi-version: v0.49.0
          cache: false
      - name: "Install and Test"
        working-directory: ${{ inputs.package-path }}
        run: |
          pixi install -e ${{ inputs.pixi-environment }}
          pixi run -e ${{ inputs.pixi-environment }} test

  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.13
        with:
          pixi-version: v0.49.0
          cache: false
      - name: "Build"
        working-directory: ${{ inputs.package-path }}
        run: |
          pixi install -e quality-ci
          pixi run -e quality-ci build
      - uses: actions/upload-artifact@v7
        with:
          name: 'dist'
          path: '${{ inputs.package-path }}/dist/'

  summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [hygiene, quality, test, build]
    if: always()
    steps:
      - name: "Summary"
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hygiene | ${{ needs.hygiene.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality | ${{ needs.quality.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
